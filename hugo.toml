baseURL = 'https://87188202.xyz/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Myblogs'
theme = 'congo-dev'
enableRobotsTXT = true
hasCJKLanguage = true
copyright = '© 2026 welegent. 保留所有文字与原创内容版权。'

[pagination]
  pagerSize = 8

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[params]
  env = 'production'
  title = 'Myblogs'
  description = '记录设计思考、项目见闻、工作笔记与日常灵感。'
  keywords = ['博客', '设计', '工作笔记', '项目记录', 'Typora']
  author = 'welegent'
  defaultTheme = 'auto'
  DateFormat = '2006-01-02'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  mainSections = ['posts']

  [params.label]
    text = 'Myblogs'

  [params.homeInfoParams]
    Title = '你好，欢迎来到我的博客 👋'
    Content = '这里记录设计思考、项目现场、工作笔记和日常灵感。文章可直接使用 Typora 写作，并插入你的图床图片链接，写完提交到 GitHub 后会自动发布。'

  [params.brand]
    name = 'welegent'
    subtitle = '设计观察者 / 项目记录者 / 长期主义实践者'
    description = '持续记录设计思考、乡村振兴项目、工作笔记与灵感片段。你可以把这里当作我的公开工作台与个人知识库。'
    avatar = '/images/avatar.svg'
    primaryButtonName = '开始阅读'
    primaryButtonLink = '/posts/'
    secondaryButtonName = '关于我'
    secondaryButtonLink = '/about/'

  [params.cover]
    hiddenInList = true
    hiddenInSingle = false
    responsiveImages = true
    linkFullImages = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 1
    keys = ['title', 'permalink', 'summary', 'content']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/welegent2010'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:hello@87188202.xyz'

  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

  [params.comments]
    enabled = true
    provider = 'utterances'
    repo = 'welegent2010/Myblogs'
    issueTerm = 'pathname'
    label = 'comment'
    theme = 'preferred-color-scheme'

  [params.footer]
    text = '用 Typora 写作，用 Hugo 构建，用 Cloudflare Pages 发布。'

[menu]
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 10

  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 20

  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 30

  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 40

  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false