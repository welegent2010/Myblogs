baseURL = 'https://87188202.xyz/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = '王晓东'
theme = 'congo-dev'
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'
  channel = 'channels'
  topic = 'topics'

[related]
  threshold = 70
  includeNewer = false
  toLower = false

  [[related.indices]]
    name = 'channels'
    weight = 60

  [[related.indices]]
    name = 'topics'
    weight = 60

  [[related.indices]]
    name = 'tags'
    weight = 40

[params]
  colorScheme = 'slate'
  defaultThemeColor = '#fbfaf8'
  defaultAppearance = 'light'
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoading = true
  enableImageWebp = true
  fingerprintAlgorithm = 'sha256'
  keywords = ['城市更新', '文旅', '产业研究', '资本市场', '研究方法', 'AI工作流', 'GIS']

  [params.journal]
    eyebrow = '独立研究档案'
    headlineOne = '城市、产业、'
    headlineTwo = '市场与方法。'
    headlineZh = '关于城市、产业、资本市场与研究方法的长期观察。'
    description = '记录城市发展、产业经济、资本市场和数字工具研究，尝试从空间、经济、资本与技术之间建立长期的分析框架。'
    authorName = '王晓东'
    aboutUrl = '/about/'
    profileUrl = 'https://www.welegent.com/'
    disclaimer = '本站内容仅用于个人研究与方法记录，不构成投资建议。'
    tagline = '从规划成果走向发展决策。'

  [params.author]
    name = '王晓东'
    headline = '城市价值与文旅策略顾问'
    bio = '20+ 年城乡规划、建筑、城市更新与文旅项目经验，关注城市价值、县域发展、产业研究、项目投资与数字化研究方法。'
    links = [
      { globe = 'https://www.welegent.com/' },
      { email = 'mailto:hello@xdstudiolab.com' },
      { rss = '/index.xml' },
    ]

  [params.header]
    layout = 'basic'
    showTitle = true

  [params.footer]
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = 'journal'
    showRecent = true
    recentLimit = 10
    featuredLimit = 5

  [params.article]
    showDate = true
    showDateUpdated = true
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showEdit = false
    showHeadingAnchors = true
    showPagination = true
    invertPagination = false
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = true
    showComments = true
    sharingLinks = ['linkedin', 'email']

  [params.list]
    showBreadcrumbs = true
    showSummary = true
    showTableOfContents = false
    showTaxonomies = true
    groupByYear = true
    paginationWidth = 1

  [params.sitemap]
    excludedKinds = ['taxonomy', 'term']

  [params.taxonomy]
    showTermCount = true

  [params.comments]
    enabled = true
    provider = 'utterances'
    repo = 'welegent2010/Myblogs'
    issueTerm = 'pathname'
    label = 'comment'
    theme = 'preferred-color-scheme'

[languages]
  [languages.zh-cn]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    languageDirection = 'ltr'
    weight = 1
    title = '王晓东'
    copyright = '© 2026 王晓东。保留所有文字与原创内容版权。'

    [languages.zh-cn.params]
      dateFormat = '2006-01-02'
      mainSections = ['posts']
      description = '独立研究档案：城市与产业、市场与金融、方法与工具。'

[menu]
  [[menu.main]]
    name = '城市与产业'
    url = '/urban/'
    weight = 10

  [[menu.main]]
    name = '市场与金融'
    url = '/markets/'
    weight = 20

  [[menu.main]]
    name = '方法与工具'
    url = '/notes/'
    weight = 30

  [[menu.main]]
    name = '主题'
    url = '/topics/'
    weight = 40

  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 50

  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 60

  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 70

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
