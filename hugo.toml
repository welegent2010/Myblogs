baseURL = 'https://87188202.xyz/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'XD Wang'
theme = 'congo-dev'
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[pagination]
  pagerSize = 6

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[params]
  colorScheme = 'slate'
  defaultThemeColor = '#0f172a'
  defaultAppearance = 'light'
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoading = true
  enableImageWebp = true
  enableQuicklink = true
  fingerprintAlgorithm = 'sha256'
  keywords = ['博客', '设计研究', '项目记录', '工作笔记', '乡村振兴']

  [params.header]
    layout = 'hybrid'
    showTitle = true

  [params.footer]
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = 'profile'
    showRecent = true
    recentLimit = 6

  [params.article]
    showDate = true
    showDateUpdated = false
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showEdit = false
    showHeadingAnchors = true
    showPagination = true
    invertPagination = false
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = true
    showComments = true
    sharingLinks = ['linkedin', 'email']

  [params.list]
    showBreadcrumbs = true
    showSummary = true
    showTableOfContents = false
    showTaxonomies = true
    groupByYear = true
    paginationWidth = 1

  [params.sitemap]
    excludedKinds = ['taxonomy', 'term']

  [params.taxonomy]
    showTermCount = true

  [params.comments]
    enabled = true
    provider = 'utterances'
    repo = 'welegent2010/Myblogs'
    issueTerm = 'pathname'
    label = 'comment'
    theme = 'preferred-color-scheme'

[languages]
  [languages.zh-cn]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    languageDirection = 'ltr'
    weight = 1
    title = 'XD Wang'
    copyright = '© 2026 welegent. 保留所有文字与原创内容版权。'

    [languages.zh-cn.params]
      dateFormat = '2006-01-02'
      mainSections = ['posts']
      description = '记录设计思考、项目见闻、工作笔记与日常灵感。'

    [languages.zh-cn.params.author]
      name = 'xd wang'
      image = 'https://ele-image.oss-cn-guangzhou.aliyuncs.com/img/QQ_1774316449530.png'
      headline = '设计观察者 / 项目记录者 / 长期主义实践者'
      bio = '持续记录设计思考、乡村振兴项目、工作笔记与灵感片段。你可以把这里当作我的公开工作台与个人知识库。'
      links = [
        { github = 'https://github.com/welegent2010' },
        { email = 'mailto:hello@87188202.xyz' },
        { rss = '/index.xml' },
      ]

[menu]
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 10

  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20

  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 30

  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 40

  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 50

  [[menu.main]]
    identifier = 'search'
    weight = 99
    [menu.main.params]
      action = 'search'

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false