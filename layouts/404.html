{{ define "main" }}
  <section class="channel-hero">
    <div class="shell">
      <span class="channel-hero__num">404</span>
      <h1 class="channel-hero__title">页面不存在</h1>
      <div class="channel-hero__zh">页面不存在</div>
      <p class="channel-hero__desc">这个地址下没有内容。可以从三个研究频道或归档重新进入。</p>
    </div>
  </section>

  <section class="section" style="border-bottom: 0">
    <div class="shell">
      <div class="index-strip">
        <span class="index-strip__label">前往</span>
        {{- range $key := slice "cities-industries" "markets-finance" "notes-methods" }}
          {{- with index site.Data.channels $key }}<a href="{{ .url }}">{{ .zh }}</a>{{ end }}
        {{- end }}
        <a href="{{ "/topics/" | relURL }}">全部主题</a>
        <a href="{{ "/archives/" | relURL }}">研究归档</a>
        <a href="{{ site.Home.RelPermalink }}">首页</a>
      </div>
    </div>
  </section>
{{ end }}
