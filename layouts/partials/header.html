<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand__mark">王晓东</span>
      <span class="brand__sub">独立研究档案</span>
    </a>
    <nav class="nav" aria-label="主导航">
      {{- range site.Menus.main }}
        <a
          href="{{ .URL | relURL }}"
          {{- if $.IsMenuCurrent "main" . }} aria-current="page" {{- end -}}
        >
          {{ .Name }}
        </a>
      {{- end }}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅色">深色</button>
    </nav>
  </div>
</header>
