{{- if .IsBlock -}}
  <figure>
    <img
      src="{{ .Destination | safeURL }}"
      alt="{{ .Text }}"
      {{- with .Title }} title="{{ . }}"{{ end -}}
      loading="lazy"
      decoding="async"
    />
    {{- with .Title }}<figcaption>{{ . | markdownify }}</figcaption>{{ end -}}
  </figure>
{{- else -}}
  <img
    src="{{ .Destination | safeURL }}"
    alt="{{ .Text }}"
    {{- with .Title }} title="{{ . }}"{{ end -}}
    loading="lazy"
    decoding="async"
  />
{{- end -}}
