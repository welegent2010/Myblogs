{{ define "main" }}
  <section class="channel-hero">
    <div class="shell">
      <span class="channel-hero__num">{{ .Data.Singular | upper }}</span>
      <h1 class="channel-hero__title">{{ .Title }}</h1>
      <p class="channel-hero__desc">
        {{ len .Pages }} 篇研究记录 ·
        <a href="{{ "/archives/" | relURL }}">研究归档</a> ·
        <a href="{{ "/topics/" | relURL }}">研究主题</a>
      </p>
    </div>
  </section>

  <section class="section" style="border-bottom: 0">
    <div class="shell">
      <div class="measure entry-list">
        {{- range .Paginator.Pages }}
          {{ partial "entry.html" (dict "page" . "variant" "row") }}
        {{- end }}
        {{ partial "pagination.html" . }}
      </div>
    </div>
  </section>
{{ end }}
