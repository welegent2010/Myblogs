{{ define "main" }}
  <section class="channel-hero">
    <div class="shell">
      <span class="channel-hero__num">索引</span>
      <h1 class="channel-hero__title">{{ .Title }}</h1>
      {{- with .Description }}<p class="channel-hero__desc">{{ . }}</p>{{ end -}}
      {{- with .Content }}<div class="channel-hero__desc">{{ . }}</div>{{ end -}}
    </div>
  </section>

  <section class="section">
    <div class="shell">
      <div class="measure">
        {{- range .Paginator.Pages }}
          {{ partial "entry.html" . }}
        {{- end }}
        {{ partial "pagination.html" . }}
      </div>
    </div>
  </section>
{{ end }}
